services:
  postgres:
    image: postgres:16-alpine
    container_name: academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: academy-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  minio:
    image: minio/minio:latest
    container_name: academy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: academy-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HttpsRedirection__Enabled: "false"
      RecordingRetention__Enabled: "false"
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      AgentApiKey: ${AGENT_API_KEY}
      ArchiveRegistrarApiKey: ${ARCHIVE_REGISTRAR_API_KEY}
      WorkerApiKey: ${WORKER_API_KEY}
      Storage__Endpoint: minio:9000
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__Bucket: ${MINIO_BUCKET}
      Jwt__Issuer: HomeQuranLearning
      Jwt__Audience: HomeQuranLearning.Dashboard
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      LiveKit__Host: wss://${ACADEMY_HOST}
      LiveKit__ApiKey: ${LIVEKIT_API_KEY}
      LiveKit__ApiSecret: ${LIVEKIT_API_SECRET}
      SeedOwner__FullName: Owner
      SeedOwner__Email: ${SEED_OWNER_EMAIL}
      SeedOwner__Password: ${SEED_OWNER_PASSWORD}
      AgentUpdates__ReleaseRoot: /agent-releases
    volumes:
      - ${AGENT_RELEASES_DIR:-/opt/homequranlearning-agent-releases}:/agent-releases:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    container_name: academy-dashboard
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://api:8080
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: academy-qa-worker
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://api:8080
      WORKER_API_KEY: ${WORKER_API_KEY}
      HF_HOME: /app/hf_cache
    volumes:
      - worker_hf_cache:/app/hf_cache
    depends_on:
      - api
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  livekit:
    image: livekit/livekit-server:v1.13.5
    container_name: academy-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 51000
          port_range_end: 51100
          use_external_ip: false
          node_ip: ${ACADEMY_HOST}
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        ingress:
          whip_base_url: https://${ACADEMY_HOST}/whip
        logging:
          level: info
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "51000-51100:51000-51100/udp"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  livekit-ingress:
    image: livekit/ingress:v1.5.0
    container_name: academy-livekit-ingress
    restart: unless-stopped
    network_mode: host
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        whip_port: 8088
        http_relay_port: 9090
        health_port: 7888
        rtc_config:
          udp_port: 7885
          use_external_ip: false
          node_ip: ${ACADEMY_HOST}
        logging:
          level: info
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ingress-manager:
    build:
      context: ../..
      dockerfile: src/LiveKitIngressManager/Dockerfile
    container_name: academy-ingress-manager
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://api:8080
      WORKER_API_KEY: ${WORKER_API_KEY}
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      api:
        condition: service_started
      livekit:
        condition: service_started
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2.11.3-alpine
    container_name: academy-caddy
    restart: unless-stopped
    environment:
      ACADEMY_HOST: ${ACADEMY_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
      - livekit
      - livekit-ingress
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  worker_hf_cache:
  caddy_data:
  caddy_config:

networks:
  academy:
    driver: bridge
