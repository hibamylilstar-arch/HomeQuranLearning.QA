services:
  api:
    environment:
      ArchiveRegistrarApiKey: ${ARCHIVE_REGISTRAR_API_KEY}

  livekit-ingress:
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        rtmp_port: 1936
        whip_port: 8088
        http_relay_port: 9090
        health_port: 7888
        rtc_config:
          udp_port: 7885
          use_external_ip: false
          node_ip: ${ACADEMY_HOST}
        logging:
          level: info

  mediamtx-relay:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.mediamtx-relay
    image: academy-mediamtx-relay:1.20.1-hook1
    container_name: academy-mediamtx-relay
    restart: unless-stopped
    ports:
      - "1935:1935"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - relay_recordings:/recordings
    depends_on:
      api:
        condition: service_started
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  recording-archive-registrar:
    build:
      context: ../..
      dockerfile: src/RecordingArchiveRegistrar/Dockerfile
    container_name: academy-recording-archive-registrar
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://api:8080
      ARCHIVE_REGISTRAR_API_KEY: ${ARCHIVE_REGISTRAR_API_KEY}
      RECORDINGS_ROOT: /recordings
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      POLL_SECONDS: "2"
      VIDEO_STREAM_COPY_VERIFIED: "true"
    volumes:
      - relay_recordings:/recordings
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - academy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  relay_recordings:
