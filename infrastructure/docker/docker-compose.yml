services:
  postgres:
    image: postgres:16-alpine
    container_name: academy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: academy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: academy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    container_name: academy-livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "51000-51100:51000-51100/udp"

  livekit-ingress:
    image: livekit/ingress:latest
    container_name: academy-livekit-ingress
    restart: unless-stopped
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: devkey
        api_secret: dev-secret-key-for-livekit-change-me-1234567890
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        rtmp_port: 1935
        whip_port: 8088
        http_port: 9090
        http_address: 0.0.0.0
    ports:
      - "1935:1935"
      - "8088:8088"
      - "9090:9090"
    depends_on:
      - livekit
      - redis

  ingress-manager:
    image: academy-ingress-manager:latest
    build:
      context: ../../src/LiveKitIngressManager
      dockerfile: Dockerfile
    container_name: academy-ingress-manager
    restart: unless-stopped
    environment:
      - BACKEND_BASE_URL=http://host.docker.internal:5100
      - WORKER_API_KEY=local-dev-worker-key
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=dev-secret-key-for-livekit-change-me-1234567890
    depends_on:
      - livekit

volumes:
  postgres_data:
  redis_data:
  minio_data:
